name: Rename version 5 file to index.html

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html with version 5
        run: |
          cp addison-felizola-engineering-portfolio-5.html index.html
          rm addison-felizola-engineering-portfolio-5.html
          rm -rf .github
          git config user.name "addisonfelizola"
          git config user.email "addisonfelizola@gmail.com"
          git add -A
          git commit -m "Replace index.html with version 5 portfolio"
          git push
